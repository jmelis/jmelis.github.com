<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jmelis</title>
<style>
  :root { --bg: #fafaf7; --card: #fff; --ink: #1f2937; --mute: #6b7280; --line: #e5e7eb; --link: #1d4ed8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111418; --card: #1a1f26; --ink: #e5e7eb; --mute: #9ca3af; --line: #2b323c; --link: #7aa7ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 56px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .lead { margin: 0 0 24px; color: var(--mute); }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .name { font-size: 19px; font-weight: 650; overflow-wrap: anywhere; }
  .repo { font-size: 14px; color: var(--mute); }
  .url { font-size: 14px; color: var(--mute); overflow-wrap: anywhere; }
  .desc { margin-top: 4px; }
  .commit { margin-top: 8px; font-size: 14px; color: var(--mute); overflow-wrap: anywhere; }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  footer { margin-top: 24px; font-size: 14px; color: var(--mute); }
</style>
</head>
<body>
<main>
  <h1>jmelis</h1>
  <p class="lead">Everything I have published with GitHub Pages, newest activity first. <a href="https://github.com/jmelis">github.com/jmelis</a></p>
  <ul id="sites"></ul>
  <footer><span id="note">Loading from GitHub…</span> “Last commit” is the latest commit on each repo’s default branch.</footer>
</main>
<script>
// The list is built here, asked straight to GitHub's API: the public repos of USER that have Pages on, each with its address and
// its latest commit. Anonymous visitors get 60 requests an hour and a fresh load needs about 12, so a result is reused for TTL
// and most visits cost nothing. If GitHub can't be reached, the last copy is shown, or just a message if there is none.
(() => {
'use strict';
const USER = 'jmelis';
const TTL = 6 * 3600 * 1000;
const KEY = 'sites.v2';
const store = {
  get() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) { /* storage blocked: just ask again next time */ } },
};

async function gh(path) {
  const r = await fetch(`https://api.github.com/${path}`, { headers: { Accept: 'application/vnd.github+json' } });
  if (!r.ok) throw Object.assign(new Error(`${path}: ${r.status}`), { status: r.status });
  return r.json();
}
const unless = (status, fallback) => (e) => { if (e.status === status) return fallback; throw e; };   // only this one status is "fine"; anything else (rate limit, network) fails the whole load

// Where a repo's Pages site lives. GitHub's Pages API needs a login, so: the repo's Website field if it has one, else the usual
// address (a custom domain still works: GitHub redirects the usual address to it).
function siteUrl(r) {
  if (/^https?:\/\//.test(r.homepage || '')) return r.homepage;
  return `https://${USER}.github.io/${r.name}/`;
}

const isUserSite = (r) => /^[^/]+\.github\.(io|com)$/i.test(r.name);     // this page's own repo: not listed

async function collect() {
  const repos = [];
  for (let page = 1; ; page++) {
    const batch = await gh(`users/${USER}/repos?type=owner&per_page=100&page=${page}`);
    repos.push(...batch);
    if (batch.length < 100) break;
  }
  const rows = await Promise.all(repos.filter((r) => r.has_pages && !isUserSite(r)).map(async (r) => {
    const commits = await gh(`repos/${r.full_name}/commits?per_page=1`).catch(unless(409, []));    // 409: empty repository
    const c = commits[0];
    return {
      name: r.name, repo: r.html_url, url: siteUrl(r),
      at: c ? c.commit.committer.date : '', sha: c ? c.sha.slice(0, 7) : '', msg: c ? c.commit.message.split('\n')[0] : '',
    };
  }));
  return rows.sort((a, b) => b.at.localeCompare(a.at));
}

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const safe = (u) => (/^https?:\/\//.test(u) ? u : '#');                          // only ever link to web addresses
const link = (cls, href, text) => { const a = el('a', cls, text); a.href = safe(href); return a; };

function render(rows) {
  const ul = document.getElementById('sites');
  ul.textContent = '';
  for (const r of rows) {
    const li = el('li');
    const head = el('div', 'head');
    head.append(link('name', r.url, r.name), link('repo', r.repo, 'repo'));
    li.append(head, el('div', 'url', r.url.replace(/^https?:\/\/|\/$/g, '')));
    if (r.sha) {
      const c = el('div', 'commit'), t = el('time', null, r.at.slice(0, 10)), a = link(null, `${r.repo}/commit/${r.sha}`);
      t.dateTime = r.at.slice(0, 10);
      a.append(el('code', null, r.sha));
      c.append(t, ' · ', a, ` ${r.msg}`);
      li.append(c);
    }
    ul.append(li);
  }
}

function show(rows, at, stale) {
  render(rows);
  document.getElementById('note').textContent = (stale ? 'GitHub could not be reached just now; this is the last copy fetched, ' : 'Live from GitHub, ')
    + new Date(at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) + '.';
}

async function main() {
  const cached = store.get();
  if (cached && Array.isArray(cached.rows) && Date.now() - cached.at < TTL) return show(cached.rows, cached.at);
  try {
    const rows = await collect();
    if (!rows.length) throw new Error('no sites');
    store.set({ at: Date.now(), rows });
    show(rows, Date.now());
  } catch (e) {
    if (cached && Array.isArray(cached.rows)) show(cached.rows, cached.at, true);
    else document.getElementById('note').textContent = 'GitHub could not be reached just now (visitors get 60 requests an hour); try again later.';
  }
}
main();
})();
</script>
</body>
</html>
